[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kvwap"
version = "0.1.0"
description = "Kalman-filter intraday volume forecasting (Chen, Feng & Palomar) and a VWAP execution agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "pandas>=2.0", "requests>=2.28"]

[project.optional-dependencies]
yahoo = ["yfinance>=0.2.40"]
dev = ["pytest>=7"]

[project.scripts]
kvwap = "kvwap.cli:main"

[tool.setuptools]
packages = ["kvwap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
